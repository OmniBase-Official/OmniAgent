[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagent"
version = "0.1.0"
description = "A local-only ReAct agent running on Ollama, with no agent framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.8",
]

[tool.setuptools]
# Flat layout: the agent is a handful of top-level modules, not a package.
py-modules = ["agent", "main", "tools", "observability"]

# --------------------------------------------------------------------------- #
# mypy - strict, no exceptions. Untyped code does not get merged.
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
files = ["agent.py", "main.py", "tools.py", "observability.py", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_decorated = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# The ReAct parser is exercised from the tests, which must reach the private
# helpers; everything else stays strict.
module = "tests.*"
disallow_any_decorated = false

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "G",         # logging format
    "ICN",       # import conventions
    "ISC",       # implicit str concat
    "PIE",
    "PT",        # pytest style
    "PTH",       # pathlib
    "RET",
    "RSE",
    "RUF",
    "S",         # bandit
    "SIM",
    "SLF",       # private member access
    "T20",       # no print() outside the CLI
    "TID",
    "TRY",       # exception handling
    "ANN",       # missing annotations
    "ARG",       # unused arguments
    "BLE",       # blind except
    "PL",        # pylint
]
ignore = [
    "ANN401",   # Any is deliberate in the logging field plumbing
    "ISC001",   # conflicts with the formatter
    "PLR0911",  # calculate() genuinely has many early returns, each a distinct error
    "TRY003",   # long messages inside raise are the useful kind here
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place allowed to write to stdout.
"main.py" = ["T20"]
# Tests assert, touch private helpers, and hard-code sample values on purpose.
"tests/*" = ["S101", "SLF001", "PLR2004", "ANN201", "ARG001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agent", "main", "observability", "tools", "tests"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
