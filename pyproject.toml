[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagent"
version = "0.1.0"
description = "A local-only ReAct agent running on Ollama, with no agent framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.8",
]
# Only needed to run scripts/smoke_train.py; the agent itself needs none of it.
# Pinned to the versions the smoke test was proved against.
training = [
    "torch>=2.4",
    "transformers==5.17.0",
    "trl==1.13.0",
    "peft==0.21.0",
    "datasets==5.0.1",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "gguf",
]

[tool.setuptools]
# Flat layout: the agent is a handful of top-level modules, not a package.
py-modules = ["agent", "main", "tools", "observability", "export_dataset", "sandbox", "validate_dataset", "config"]

# --------------------------------------------------------------------------- #
# mypy - strict, no exceptions. Untyped code does not get merged.
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
# scripts/smoke_train.py is deliberately absent: it imports the optional
# training stack, which CI does not install.
files = [
    "agent.py",
    "main.py",
    "tools.py",
    "observability.py",
    "export_dataset.py",
    "sandbox.py",
    "validate_dataset.py",
    "config.py",
    "scripts/collect_dataset.py",
    "tests",
]
mypy_path = "scripts"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_decorated = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# The ReAct parser is exercised from the tests, which must reach the private
# helpers; everything else stays strict.
module = "tests.*"
disallow_any_decorated = false

[[tool.mypy.overrides]]
# The training stack is optional and only used by notebooks and scripts.
module = ["torch.*", "transformers.*", "trl.*", "peft.*", "datasets.*", "accelerate.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "G",         # logging format
    "ICN",       # import conventions
    "ISC",       # implicit str concat
    "PIE",
    "PT",        # pytest style
    "PTH",       # pathlib
    "RET",
    "RSE",
    "RUF",
    "S",         # bandit
    "SIM",
    "SLF",       # private member access
    "T20",       # no print() outside the CLI
    "TID",
    "TRY",       # exception handling
    "ANN",       # missing annotations
    "ARG",       # unused arguments
    "BLE",       # blind except
    "PL",        # pylint
]
ignore = [
    "ANN401",   # Any is deliberate in the logging field plumbing
    "ISC001",   # conflicts with the formatter
    "PLR0911",  # calculate() genuinely has many early returns, each a distinct error
    "TRY003",   # long messages inside raise are the useful kind here
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place allowed to write to stdout.
"main.py" = ["T20"]
# The exporter is a CLI too.
"export_dataset.py" = ["T20"]
"validate_dataset.py" = ["T20"]
# Dev scripts print, and smoke_train imports the training stack late on
# purpose so a dataset problem is reported before torch loads.
"scripts/*" = ["T20", "PLC0415", "E402"]
# Notebook cells print, group imports on one line and shell out. Real checks
# (F, E501, syntax) still apply, and tests/test_notebook.py covers the rest.
"notebooks/*.ipynb" = ["T20", "E401", "E402", "I001", "S603", "S607", "ANN", "PTH123", "UP017"]
# Tests assert, touch private helpers, and hard-code sample values on purpose.
"tests/*" = ["S101", "SLF001", "PLR2004", "ANN201", "ARG001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agent", "config", "export_dataset", "main", "observability", "sandbox", "tools", "validate_dataset", "tests"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
