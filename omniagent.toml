# OmniAgent settings. Command line > environment > .env > profile > defaults.

[defaults]
model = "qwen2.5-coder:7b"
log_level = "INFO"
max_steps = 8

[profile.demo]
# Pin the evaluated local fine-tune for the demo.
model = "omniagent-v2"
# Match the evaluation's eight-step budget.
max_steps = 8
temperature = 0.0
