# OmniAgent settings. Command line > environment > .env > profile > defaults.

[defaults]
model = "qwen2.5-coder:7b"
log_level = "INFO"
max_steps = 8

[profile.demo]
# What the Saturday run uses: more room to think, and everything logged.
# The model is pinned here on purpose. Inheriting [defaults] put the demo on
# the stock 7B, whose own default context is 4096 -- short enough to truncate
# the system prompt from the front. The fine-tune's Modelfile pins 16384.
model = "omniagent"
# 8, not 12: every figure in NEXT_CHAT.md was measured at 8, and the demo
# should not be the one configuration nobody has evaluated. Rehearsing at 12,
# "What is inside the data directory?" spent all twelve steps and gave up -- a
# question the evaluation has at 10/10 in 3 to 9 steps. A test ties this to the
# evaluation's own default so the two cannot drift apart again.
max_steps = 8
log_file = "data/demo.jsonl"
temperature = 0.0

[profile.collect]
# Build up training data: log everything, quiet console.
log_file = "data/collect.jsonl"
log_level = "DEBUG"
verbose = false
