name: CI

# The three gates that have to be green before anything is committed locally,
# enforced on every push. The training extras are deliberately not installed:
# torch is gigabytes, and nothing in the test suite needs it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: .venv

  secret-scan:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create trusted scanner config and clear repository suppressions
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-trust/ignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-trust/gitleaks.toml"
          rm -rf -- "$GITHUB_WORKSPACE/.gitleaks.toml" "$GITHUB_WORKSPACE/.gitleaksignore"

      - name: Scan full Git history with Gitleaks
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/gitleaks-trust,target=/trust,readonly" \
            "$GITLEAKS_IMAGE" git \
            --config /trust/gitleaks.toml \
            --gitleaks-ignore-path /trust/gitleaks-ignore \
            --redact --no-banner --log-opts="--all" /repo
  windows-tests:
    name: Windows / pytest
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

  windows-publisher-acl:
    name: Windows / publisher cross-SID ACL
    if: >-
      github.repository == 'OmniBase-Official/OmniAgent' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/codex/scale-security-hardening-20261113' ||
         github.ref == 'refs/heads/codex/security-scans-validation-20261120')))
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Validate publisher staging across Windows SIDs
        shell: powershell
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ("publisher-acl-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + ".json")
          .\scripts\validate_windows_publish_acl.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedCommit $env:GITHUB_SHA -EvidencePath $evidence

      - name: Preserve sanitized Windows ACL evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-publisher-acl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-acl-${{ github.run_id }}-${{ github.run_attempt }}.*
          if-no-files-found: warn
          retention-days: 7
