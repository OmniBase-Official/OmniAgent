name: CI

# The three gates that have to be green before anything is committed locally,
# enforced on every push. The training extras are deliberately not installed:
# torch is gigabytes, and nothing in the test suite needs it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: .venv

  secret-scan:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create trusted scanner config and clear repository suppressions
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-trust/ignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-trust/gitleaks.toml"
          cat > "$RUNNER_TEMP/gitleaks-trust/ignore/.gitleaksignore" <<'EOF'
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_validate_dataset.py:generic-api-key:126
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_validate_dataset.py:generic-api-key:148
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_validate_dataset.py:generic-api-key:161
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_validate_dataset.py:generic-api-key:188
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_publish_dataset.py:generic-api-key:194
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_publish_dataset.py:generic-api-key:200
          3576aebaf297c5e956ac9d9f0b80eb50a9af44af:tests/test_publish_dataset.py:generic-api-key:202
          8ebc04a8f548817e75834bb864659b357872a140:tests/test_validate_dataset.py:generic-api-key:168
          8ebc04a8f548817e75834bb864659b357872a140:tests/test_validate_dataset.py:generic-api-key:178
          EOF
          rm -rf -- "$GITHUB_WORKSPACE/.gitleaks.toml" "$GITHUB_WORKSPACE/.gitleaksignore"

      - name: Scan and sanitize full-history Gitleaks report
        id: gitleaks_scan
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/gitleaks-output"
          raw_report="$output_dir/raw-report.json"
          sanitized_report="$output_dir/sanitized-report.json"
          trap 'rm -f -- "$raw_report"' EXIT
          mkdir -m 700 -p "$output_dir"
          chmod 700 "$output_dir"
          umask 077
          if docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/gitleaks-trust,target=/trust,readonly" \
            --mount "type=bind,source=${output_dir},target=/reports" \
            "$GITLEAKS_IMAGE" git \
            --config /trust/gitleaks.toml \
            --gitleaks-ignore-path /trust/ignore \
            --redact=100 --no-banner --log-opts="--all" \
            --report-format json --report-path /reports/raw-report.json /repo \
            >/dev/null 2>&1; then
            scan_exit=0
          else
            scan_exit=$?
          fi
          if [ ! -s "$raw_report" ]; then
            echo "Gitleaks did not produce a JSON report (exit code ${scan_exit})." >&2
            exit "${scan_exit:-2}"
          fi
          python3 - "$raw_report" "$sanitized_report" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          source, destination = map(Path, sys.argv[1:])
          allowed = ("RuleID", "File", "Commit", "StartLine", "Fingerprint")
          report = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(report, list):
              raise SystemExit("Gitleaks JSON report has an unexpected top-level type.")
          sanitized = []
          for finding in report:
              if not isinstance(finding, dict):
                  raise SystemExit("Gitleaks JSON report contains an invalid finding.")
              sanitized.append({key: finding.get(key) for key in allowed})
          with destination.open("x", encoding="utf-8") as output:
              json.dump(sanitized, output, ensure_ascii=True, separators=(",", ":"))
              output.write("\n")
          os.chmod(destination, 0o600)
          PY
          rm -f -- "$raw_report"
          echo "sanitized_report=$sanitized_report" >> "$GITHUB_OUTPUT"
          if [ "$scan_exit" -ne 0 ]; then
            echo "Gitleaks scan failed or found secrets (exit code ${scan_exit}); sanitized findings are attached." >&2
            exit "$scan_exit"
          fi

      - name: Upload sanitized Gitleaks findings on failure
        if: failure() && steps.gitleaks_scan.outputs.sanitized_report != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gitleaks-sanitized-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gitleaks_scan.outputs.sanitized_report }}
          if-no-files-found: error
          retention-days: 7
  windows-tests:
    name: Windows / pytest
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Prepare private pytest staging root
        shell: powershell
        run: .\scripts\prepare_windows_private_test_root.ps1 -Action Create -OutputVariable OMNIAGENT_PRIVATE_TEST_ROOT

      - name: Test
        run: pytest

      - name: Cleanup private pytest staging root
        if: always()
        shell: powershell
        run: .\scripts\prepare_windows_private_test_root.ps1 -Action Cleanup -OutputVariable OMNIAGENT_PRIVATE_TEST_ROOT

  windows-publisher-acl:
    name: Windows / publisher cross-SID ACL
    if: >-
      github.repository == 'OmniBase-Official/OmniAgent' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/codex/scale-security-hardening-20261113' ||
         github.ref == 'refs/heads/codex/security-scans-validation-20261120' ||
         github.ref == 'refs/heads/codex/security-runner-fixtures-20261120')))
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -e ".[dev]"

      - name: Prepare private publisher staging root
        shell: powershell
        run: .\scripts\prepare_windows_private_test_root.ps1 -Action Create -OutputVariable OMNIAGENT_PUBLISHER_STAGING_ROOT

      - name: Validate publisher staging across Windows SIDs
        shell: powershell
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ("publisher-acl-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT + ".json")
          .\scripts\validate_windows_publish_acl.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedCommit $env:GITHUB_SHA -EvidencePath $evidence -RunnerTempPath $env:OMNIAGENT_PUBLISHER_STAGING_ROOT

      - name: Preserve sanitized Windows ACL evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-publisher-acl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-acl-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup private publisher staging root
        if: always()
        shell: powershell
        run: .\scripts\prepare_windows_private_test_root.ps1 -Action Cleanup -OutputVariable OMNIAGENT_PUBLISHER_STAGING_ROOT
