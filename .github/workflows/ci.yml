name: CI

# The three gates that have to be green before anything is committed locally,
# enforced on every push. The training extras are deliberately not installed:
# torch is gigabytes, and nothing in the test suite needs it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" wheel
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest

      - name: Build and smoke-test wheel
        run: |
          mkdir -p "$RUNNER_TEMP/wheel"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheel" .
          wheel_path=$(find "$RUNNER_TEMP/wheel" -maxdepth 1 -name 'omniagent-*.whl' -print -quit)
          test -n "$wheel_path"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$wheel_path"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import agent, config, config_inspection, dataset_provenance, export_dataset, main, observability, sandbox, tools, trajectory_utils, validate_dataset"

  windows-tests:
    name: Windows / pytest
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" wheel
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest
