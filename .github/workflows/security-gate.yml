name: Security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks / full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        run: >-
          docker run --rm
          --read-only
          --cap-drop=ALL
          --security-opt=no-new-privileges
          --network=none
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --log-opts=--all

  dependency-audit:
    name: pip-audit / installed dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install project and pinned auditor
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Audit installed dependencies
        run: pip-audit
