name: Update Coding Time Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Update WakaTime Statistics
        # Pin to the reviewed upstream commit; update only after reviewing its action metadata.
        uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          LANG_COUNT: 10
          SHOW_TITLE: true
